name: Deploy

# Push to main deploys. A pull request gets a preview link. "Run workflow" in the GitHub app
# redeploys main from a phone. Every path runs the full test suite first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/client/
          include-hidden-files: true
          retention-days: 7

  preview:
    needs: check
    # Forks don't get secrets, so only same-repo PRs get a preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist/client/
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload \
            --preview-alias "pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }} @ ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' upload.log | tail -1)
          echo "### Preview: ${url:-see log above}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://plumb.isocline.ai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist/client/
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "${GITHUB_SHA::7} via ${{ github.event_name }}"
      - name: Smoke test
        run: |
          for path in / /session/spine-line /manifest.webmanifest; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 "https://plumb.isocline.ai$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
