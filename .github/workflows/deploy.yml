name: Deploy

# Push to main deploys. A pull request gets a preview link. "Run workflow" in the GitHub app
# redeploys main from a phone. The Cloudflare account is pinned in wrangler.jsonc, so the
# only secret is CLOUDFLARE_API_TOKEN. Every path runs the full test suite first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # No dependency install scripts: this job builds the bundle that ships, so a compromised
      # package must not get to run code here. esbuild and workerd work from their prebuilt
      # platform packages without their postinstall checks.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/client/
          include-hidden-files: true
          retention-days: 7

  preview:
    needs: check
    # Forks don't get secrets, so only same-repo PRs get a preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist/client/
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler versions upload \
            --preview-alias "pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }} @ ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' upload.log | tail -1)
          echo "### Preview: ${url:-see log above}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://plumb.isocline.ai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist/client/
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --message "${GITHUB_SHA::7} via ${{ github.event_name }}"
      - name: Smoke test
        run: |
          for path in / /session/spine-line /manifest.webmanifest; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 "https://plumb.isocline.ai$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
      # Plumb's privacy promise depends on the live page being exactly what was built: Cloudflare
      # features such as Bot Fight Mode / JavaScript detections, Rocket Loader, Email Obfuscation
      # and Web Analytics inject scripts into HTML on the way out.
      - name: Live page matches the build and carries its CSP
        run: |
          for path in / /session/spine-line; do
            # Ask like a phone browser: Cloudflare only injects some scripts (e.g. Web Analytics) into
            # requests that look like one. --retry-all-errors also covers TLS blips (curl exit 35).
            curl -sf --compressed --retry 5 --retry-delay 3 --retry-all-errors \
              -A "Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
              -D headers.txt -o live.html "https://plumb.isocline.ai$path"
            if ! grep -qi '^content-security-policy:.*connect-src' headers.txt; then
              echo "::error::$path is served without Plumb's Content-Security-Policy"
              exit 1
            fi
            if ! cmp -s live.html dist/client/index.html; then
              echo "::error::$path differs from the built index.html; something between the build and the phone is changing the page (a Cloudflare zone feature injecting a script?)"
              diff -a <(sed 's/></>\n</g' dist/client/index.html) <(sed 's/></>\n</g' live.html) | head -40
              exit 1
            fi
            echo "$path: CSP present, page identical to the build"
          done
