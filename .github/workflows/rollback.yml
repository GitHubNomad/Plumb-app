name: Rollback

# Undo a bad deploy from the GitHub app: Actions → Rollback → Run workflow.
# Leave the version blank to go back one deploy; the Deploy run logs each version id.
on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Version id to roll back to (blank = the previous deploy)"
        required: false
      reason:
        description: "Why"
        required: false
        default: "Rolled back from GitHub Actions"

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Roll back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
        run: npx wrangler rollback $VERSION_ID --message "$REASON" --yes
      - run: npx wrangler deployments list | head -20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
